<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#FBF6EC">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#FDF7F1;
  --paper-line:#F0E1D2;
  --ink:#3A3026;
  --ink-soft:#8a7d6c;
  --sakura:#F5C0CC;
  --sakura-deep:#E695AC;
  --indigo:#6274B0;
  --indigo-deep:#4A5790;
  --hanko:#D5687A;
  --sage:#96C596;
  --sage-deep:#5F9061;
  --amber:#E3B57C;
  --card:#FFFFFF;
  --shadow: 0 6px 16px rgba(230,150,170,0.14), 0 1px 3px rgba(90,70,40,0.05);
  --radius: 20px;
  /* seasonal tab colors */
  --s-spring:#F5C0CC;
  --s-fresh:#AFD69B;
  --s-summer:#8CC7E0;
  --s-autumn:#E3B57C;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%; font-size:18px;}
body{
  margin:0;
  font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  color:var(--ink);
  background:
    repeating-linear-gradient(var(--paper) 0 27px, var(--paper-line) 27px 28px),
    var(--paper);
  background-attachment: local;
  min-height:100vh;
  line-height:1.6;
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important;}
}
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3{font-family:'Zen Maru Gothic',sans-serif; margin:0 0 .4em;}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}

/* ---------- layout ---------- */
.app-shell{max-width:960px;margin:0 auto;padding:0 16px 64px;}
header.top{
  position:sticky; top:0; z-index:30;
  background:var(--paper);
  border-bottom:2px solid var(--ink);
  padding:10px 16px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  row-gap:8px;
}
@media (max-width:480px){
  header.top{padding:8px 12px;}
  .brand-text{font-size:1rem;}
  .hanko-mark{width:32px;height:32px;font-size:12px;}
  .sync-badge{order:5; width:100%; text-align:right;}
}
.brand{
  display:flex; align-items:center; gap:10px; margin-right:auto;
  cursor:pointer; user-select:none;
}
.hanko-mark{
  width:38px;height:38px;border-radius:50%;
  background:var(--hanko);
  color:#fff8f0; display:flex;align-items:center;justify-content:center;
  font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:15px;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transform:rotate(-6deg);
  flex-shrink:0;
}
.brand-text{font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:1.15rem; letter-spacing:.02em;}
.brand-text small{display:block; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:400; font-size:.62rem; color:var(--ink-soft); letter-spacing:.05em;}

.nav-btn{
  border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
  border-radius:20px; padding:6px 13px; font-size:.82rem; font-weight:500;
  cursor:pointer; white-space:nowrap;
}
.nav-btn.active{background:var(--ink); color:var(--paper);}
.nav-btn.ghost{border-color:transparent; background:transparent;}
select.month-select{
  border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
  border-radius:20px; padding:6px 10px; font-size:.82rem; font-weight:500; cursor:pointer;
}
.sync-badge{font-size:.68rem; color:var(--ink-soft); white-space:nowrap;}

main{padding-top:18px;}

.card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px 18px 20px;
  margin-bottom:16px;
  position:relative;
}
.washi{
  position:absolute; top:-10px; left:22px; width:64px; height:22px;
  background:repeating-linear-gradient(45deg, var(--sakura) 0 6px, var(--sakura-deep) 6px 12px);
  opacity:.85; transform:rotate(-3deg);
  border-radius:8px;
  box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.card h2{font-size:1.02rem; display:flex; align-items:center; gap:8px;}
.card .hint{font-size:.76rem; color:var(--ink-soft); margin:-6px 0 12px;}

/* month tabs (seasonal) */
.tabbar{display:flex; gap:6px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar button{
  flex:0 0 auto; border:none; border-bottom:4px solid transparent;
  background:var(--card); border-radius:14px 14px 0 0;
  padding:7px 12px; font-size:.8rem; font-weight:700; color:var(--ink-soft);
  cursor:pointer; font-family:'Zen Maru Gothic',sans-serif;
}
.tabbar button.active{color:var(--ink); background:#fff;}

/* summary grid */
.sum-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
.sum-item{
  background:var(--paper); border:1px solid var(--paper-line); border-radius:16px;
  padding:10px 12px;
}
.sum-item .lbl{font-size:.72rem; color:var(--ink-soft); font-weight:500;}
.sum-item .val{font-size:1.25rem; font-weight:700; font-family:'Zen Maru Gothic',sans-serif;}
.sum-item.plus .val{color:var(--sage-deep);}
.sum-item.minus .val{color:var(--hanko);}

/* tables */
table.ledger{width:100%; border-collapse:collapse; font-size:.86rem;}
table.ledger th{
  text-align:left; font-weight:500; color:var(--ink-soft); font-size:.72rem;
  border-bottom:1.5px solid var(--ink); padding:4px 6px;
}
table.ledger td{padding:5px 6px; border-bottom:1px dashed var(--paper-line); vertical-align:middle;}
table.ledger tr:last-child td{border-bottom:none;}
table.ledger td.amt{text-align:right;}
table.ledger tfoot td{border-top:2px solid var(--ink); border-bottom:none; font-weight:700; padding-top:8px;}

/* 固定費テーブルはスマホ幅でカード風に積み上げる（項目/金額/方法を横スクロールなしで） */
@media (max-width:600px){
  table.ledger.ledger-items thead{display:none;}
  table.ledger.ledger-items, table.ledger.ledger-items tbody, table.ledger.ledger-items tr{display:block; width:100%;}
  table.ledger.ledger-items td{display:block; border:none; padding:3px 0;}
  table.ledger.ledger-items tr{
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:"item item" "amount method" "del del";
    gap:4px 8px;
    padding:10px 0;
    border-bottom:1px dashed var(--paper-line);
    align-items:center;
  }
  table.ledger.ledger-items tr:last-child{border-bottom:none;}
  table.ledger.ledger-items td.item-cell{grid-area:item;}
  table.ledger.ledger-items td.amt{grid-area:amount; text-align:left;}
  table.ledger.ledger-items td.method-cell{grid-area:method;}
  table.ledger.ledger-items td:last-child:not(.item-cell):not(.amt):not(.method-cell){grid-area:del; text-align:right;}
  table.ledger.ledger-items .amt-input{width:100%;}
  table.ledger.ledger-items tfoot tr{display:flex; justify-content:space-between; border-top:2px solid var(--ink); padding-top:8px;}
  table.ledger.ledger-items tfoot td{border:none; padding:0;}
}

input[type=text], input[type=number], select, textarea{
  font-family:inherit; border:1.5px solid #ddc9b8; border-radius:14px;
  padding:6px 8px; font-size:.86rem; background:#fffef9; color:var(--indigo-deep);
  width:100%;
}
input[type=number]{color:var(--indigo-deep); font-weight:600;}
input:focus, select:focus, textarea:focus{outline:3px solid #8CC7E055; border-color:var(--indigo);}
.row-item-input{min-width:90px;}
.amt-input{width:110px; text-align:right;}
.method-select{min-width:120px;}
td.item-cell{width:32%;}
td.method-cell{width:28%;}

.btn{
  border:1.5px solid var(--ink); background:var(--card); border-radius:16px;
  padding:7px 14px; font-size:.82rem; font-weight:700; cursor:pointer;
  font-family:'Zen Maru Gothic',sans-serif;
}
.btn.primary{background:var(--indigo); border-color:var(--indigo-deep); color:#fff;}
.btn.danger{background:var(--card); border-color:var(--hanko); color:var(--hanko);}
.btn.small{padding:4px 10px; font-size:.74rem;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}

.del-btn{background:none;border:none;color:var(--hanko);cursor:pointer;font-size:1rem;padding:2px 6px;}

textarea{min-height:70px; resize:vertical;}

/* budget bar */
.bud-bar-track{background:var(--paper); border:1px solid var(--paper-line); border-radius:10px; height:14px; overflow:hidden; position:relative;}
.bud-bar-fill{height:100%; background:var(--sage); border-radius:10px 0 0 10px;}
.bud-bar-fill.over{background:var(--hanko);}
.bud-row{display:grid; grid-template-columns:52px 1fr 90px; gap:10px; align-items:center; padding:6px 0; font-size:.82rem;}
.bud-row .amt{text-align:right; font-weight:600;}

/* year table scroll */
.table-scroll{overflow-x:auto;}
table.year-tbl{border-collapse:collapse; font-size:.8rem; min-width:760px; width:100%;}
table.year-tbl th, table.year-tbl td{padding:6px 8px; text-align:right; white-space:nowrap;}
table.year-tbl th:first-child, table.year-tbl td:first-child{text-align:left; position:sticky; left:0; background:var(--card);}
table.year-tbl thead th{border-bottom:2px solid var(--ink); font-weight:700; color:var(--ink-soft); font-size:.72rem;}
table.year-tbl tbody tr td{border-bottom:1px dashed var(--paper-line);}
table.year-tbl tfoot td{border-top:2px solid var(--ink); font-weight:700;}
table.year-tbl td.total-col{font-weight:700; color:var(--indigo-deep);}

.jump-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(60px,1fr)); gap:8px;}
.jump-grid button{border:1.5px solid var(--ink); border-radius:16px; background:var(--card); padding:8px 4px; font-weight:700; cursor:pointer; font-family:'Zen Maru Gothic',sans-serif;}

.help-block{margin-bottom:14px;}
.help-block h3{font-size:.92rem;}
.help-block p, .help-block li{font-size:.86rem; color:var(--ink-soft);}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-grid.one{grid-template-columns:1fr;}
.field label{display:block; font-size:.74rem; color:var(--ink-soft); margin-bottom:4px; font-weight:500;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}

.status-msg{font-size:.8rem; border-radius:14px; padding:8px 12px; margin-top:8px;}
.status-msg.ok{background:#eef5ea; color:var(--sage-deep); border:1px solid #cfe3c6;}
.status-msg.err{background:#fbeceb; color:var(--hanko); border:1px solid #f0c9c8;}
.status-msg.info{background:#eaf0f7; color:var(--indigo-deep); border:1px solid #c9d6ea;}

.pill-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.pill{background:var(--paper); border:1px solid var(--paper-line); border-radius:20px; padding:4px 10px 4px 12px; font-size:.78rem; display:flex; align-items:center; gap:6px;}
.pill button{border:none;background:none;color:var(--hanko);cursor:pointer;font-weight:700;}

footer.foot{text-align:center; font-size:.72rem; color:var(--ink-soft); margin-top:30px;}
</style>
</head>

/* 旧形式（年が1つ固定・DATA.months直下）を新形式（DATA.years[年].months）に変換 */
function migrateData(d){
  if(!d) return d;
  if(d.years) return d;
  if(d.months){
    const year = Number(d.year) || 2026;
    return {
      version:2,
      currentYear: year,
      settings: d.settings,
      years: { [String(year)]: { months: d.months } }
    };
  }
  return d;
}

/* ====================== データ読み書き ====================== */
var DATA = loadLocal() || defaultData();
var DIRTY = false; // ローカル変更が未コミットか

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const d = migrateData(JSON.parse(raw));
    if(!d || !d.years || !d.years[String(d.currentYear)]) return null;
    return d;
  }catch(e){ return null; }
}
function currentMonths(){
  return DATA.years[String(DATA.currentYear)].months;
}
function saveLocal(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  DIRTY = true;
  updateSyncBadge();
}
function loadCfg(){
  try{ return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }catch(e){ return {}; }
}
function saveCfg(cfg){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

function fmtYen(n){
  n = Math.round(Number(n)||0);
  const s = Math.abs(n).toLocaleString('ja-JP');
  return (n<0?'-':'') + '¥' + s;
}
function fmtDateTime(iso){
  if(!iso) return '未同期';
  const d = new Date(iso);
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ====================== 計算 ====================== */
function calcMonth(mKey){
  const m = currentMonths()[mKey];
  if(!m) return null;
  const incomeA = Number(m.incomeA)||0;
  const incomeB = Number(m.incomeB)||0;
  const income = incomeA + incomeB;
  const fixedATotal = m.fixedA.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const fixedBTotal = m.fixedB.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const fixed = fixedATotal + fixedBTotal;
  const paypay = Number(m.food.paypay)||0;
  const cash = Number(m.food.cash)||0;
  const food = paypay + cash;
  const expense = fixed + food;
  const savings = income - expense;

  const byMethod = {};
  DATA.settings.paymentMethods.forEach(pm=>byMethod[pm]=0);
  [...m.fixedA, ...m.fixedB].forEach(r=>{
    const key = r.method || '(未設定)';
    byMethod[key] = (byMethod[key]||0) + (Number(r.amount)||0);
  });
  byMethod['PayPay'] = (byMethod['PayPay']||0) + paypay;
  byMethod['現金'] = (byMethod['現金']||0) + cash;
  const byMethodTotal = Object.values(byMethod).reduce((a,b)=>a+b,0);

  const budget = Number(DATA.settings.monthlyBudget)||0;
  const budgetDiff = budget - food;

  return {incomeA, incomeB, income, fixedATotal, fixedBTotal, fixed, paypay, cash, food, expense, savings, byMethod, byMethodTotal, budget, budgetDiff};
}

}

  return (location.hash || '#year').slice(1);

function render(){
  const view = currentView();
  document.getElementById('yearLabel').textContent = DATA.currentYear;
  document.title = '家計簿 ' + DATA.currentYear;
  fillYearSelect();
  fillMonthJump(view);
  const main = document.getElementById('main');
  if(view === 'year'){ main.innerHTML = renderYear(); afterYearRender(); }
  else if(view === 'settings'){ main.innerHTML = renderSettings(); afterSettingsRender(); }
  else if(view === 'help'){ main.innerHTML = renderHelp(); }
  else if(/^m(\d{1,2})$/.test(view)){
    const mi = parseInt(view.match(/^m(\d{1,2})$/)[1],10);
    if(mi>=1 && mi<=12){ main.innerHTML = renderMonth(mi); afterMonthRender(mi); }
    else { main.innerHTML = '<div class="card">ページが見つかりません</div>'; }
  } else {
    main.innerHTML = renderYear(); afterYearRender();
  }
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}

  const budEl = document.getElementById('budget-msg-'+mi);
  if(budEl){ budEl.textContent = budgetMsg(c); budEl.className = 'status-msg ' + (c.budgetDiff>=0?'ok':'err'); }
  const methodTable = document.getElementById('method-table-'+mi);
  if(methodTable){

      `<tr><td>${escHtml(pm)}</td><td class="amt num">${fmtYen(c.byMethod[pm]||0)}</td></tr>`).join('');

    <p class="hint" style="margin-top:10px;">最終同期：<span id="lastSyncText">${fmtDateTime(cfg.lastSync)}</span></p>
    <div id="githubStatus"></div>
  </div>

  <div class="card">
    <h2>バックアップ</h2>
    <p class="hint">GitHubを使わなくても、JSONファイルとして手元に保存・読込ができます</p>
    <div class="btn-row">
      <button class="btn" onclick="exportJson()">JSONファイルを書き出す</button>
      <label class="btn" style="cursor:pointer;">JSONファイルを読み込む<input type="file" accept="application/json" style="display:none" onchange="importJson(this.files[0])"></label>
      <button class="btn danger" onclick="resetAll()">データを初期状態に戻す</button>
    </div>
  </div>
  `;
}
function afterSettingsRender(){}

function yearPillsHtml(){
  const years = Object.keys(DATA.years).map(Number).sort((a,b)=>a-b);
  return years.map(y=>{
    const active = y===DATA.currentYear;
    return `<span class="pill" style="cursor:pointer;${active?'background:var(--indigo);color:#fff;border-color:var(--indigo-deep);':''}" onclick="switchYear(${y})">${y}年${years.length>1?`<button onclick="event.stopPropagation();deleteYear(${y})" title="この年のデータを削除">✕</button>`:''}</span>`;
  }).join('');
}
function addYearFromSettings(){
  const input = document.getElementById('newYearInput');
  const y = parseInt(input.value, 10);
  if(!y || y<2000 || y>2100){ alert('正しい年（西暦4桁）を入力してください'); return; }
  if(DATA.years[String(y)]){ alert('その年はすでに存在します'); switchYear(y); return; }
  addYear(y);
}
function addYear(y){
  const templateYear = DATA.currentYear;
  DATA.years[String(y)] = { months: buildBlankYearMonths(templateYear) };
  DATA.currentYear = y;
  saveLocal();
  location.hash = 'year';
  render();
}
function buildBlankYearMonths(templateYear){
  const src = DATA.years[String(templateYear)] && DATA.years[String(templateYear)].months;
  const defaults = DATA.settings.fixedDefaults;
  const withDefaultAmount = (rows, defGroup) => rows.map(r=>{
    const def = defGroup && defGroup.find(d=>d.item===r.item);
    return {item:r.item, amount: def ? (Number(def.amount)||0) : 0, method:r.method};
  });
  const result = {};
  for(let i=1;i<=12;i++){
    const key = String(i);
    const base = (src && (src[key] || src['1'])) || null;
    result[key] = base ? {
      incomeA:0,
      incomeB:0,
      fixedA: withDefaultAmount(base.fixedA, defaults && defaults.fixedA),
      fixedB: withDefaultAmount(base.fixedB, defaults && defaults.fixedB),
      food:{paypay:0, cash:0},
      memo:''
    } : {incomeA:0, incomeB:0, fixedA:[], fixedB:[], food:{paypay:0,cash:0}, memo:''};
  }
  return result;
}
function deleteYear(y){
  if(Object.keys(DATA.years).length<=1){ alert('最後の1年は削除できません'); return; }
  if(!confirm(y+'年のデータを削除しますか？元に戻せません。')) return;
  delete DATA.years[String(y)];
  if(DATA.currentYear === y){
    DATA.currentYear = Math.max(...Object.keys(DATA.years).map(Number));
  }
  saveLocal();
  render();
}

/* ---- 固定費のデフォルト金額 ---- */
function ensureFixedDefaults(){
  if(!DATA.settings.fixedDefaults){
    const months = currentMonths();
    const src = months['1'] || months[Object.keys(months)[0]];
    DATA.settings.fixedDefaults = {
      fixedA: src ? src.fixedA.map(r=>({item:r.item, amount:r.amount, method:r.method})) : [],
      fixedB: src ? src.fixedB.map(r=>({item:r.item, amount:r.amount, method:r.method})) : []
    };
    saveLocal();
  }
  return DATA.settings.fixedDefaults;
}
function renderFixedDefaultsGroup(group, personLabel){
  const defaults = ensureFixedDefaults()[group];
  const rows = defaults.map((r,idx)=>`
    <tr>
      <td class="item-cell"><input type="text" class="row-item-input" value="${escAttr(r.item)}" oninput="onFixedDefaultChange('${group}',${idx},'item',this.value)"></td>
      <td class="amt"><input type="number" class="amt-input num" inputmode="numeric" value="${r.amount||0}" oninput="onFixedDefaultChange('${group}',${idx},'amount',this.value)"></td>
      <td class="method-cell"><select class="method-select" onchange="onFixedDefaultChange('${group}',${idx},'method',this.value)">${methodOptions(r.method)}</select></td>
      <td><button class="del-btn" title="この項目を削除" onclick="removeFixedDefaultRow('${group}',${idx})">✕</button></td>
    </tr>`).join('');
  return `
    <h3 style="font-size:.92rem;">${escHtml(personLabel)}の固定費</h3>
    <div class="table-scroll">
    <table class="ledger ledger-items">
      <thead><tr><th>項目</th><th style="text-align:right">金額</th><th>支払い方法</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div class="btn-row"><button class="btn small" onclick="addFixedDefaultRow('${group}')">＋ 項目を追加</button></div>
  `;
}
function onFixedDefaultChange(group, idx, field, value){
  const row = ensureFixedDefaults()[group][idx];
  row[field] = (field==='amount') ? Number(value)||0 : value;
  saveLocal();
}
function addFixedDefaultRow(group){
  const defMethod = DATA.settings.paymentMethods[0] || '';
  ensureFixedDefaults()[group].push({item:'', amount:0, method:defMethod});
  saveLocal();
  render();
}
function removeFixedDefaultRow(group, idx){
  ensureFixedDefaults()[group].splice(idx,1);
  saveLocal();
  render();
}
function applyFixedDefaultsToAllMonths(){
  const defaults = ensureFixedDefaults();
  if(!confirm(`${DATA.currentYear}年のうち、まだ金額が0円のままの項目にだけデフォルト金額を反映します。すでに金額を入力した月・項目は変更されません。よろしいですか？`)) return;
  const months = currentMonths();
  ['fixedA','fixedB'].forEach(group=>{
    defaults[group].forEach(def=>{
      if(!def.item) return;
      for(let i=1;i<=12;i++){
        const m = months[String(i)];
        if(!m) continue;
        const row = m[group].find(r=>r.item===def.item);
        if(row){
          if(!row.amount) row.amount = Number(def.amount)||0;
        } else {
          m[group].push({item:def.item, amount:Number(def.amount)||0, method:def.method});
        }
      }
    });
  });
  saveLocal();
  render();
  showFixedDefaultsStatus('反映しました', 'ok');
}
function showFixedDefaultsStatus(msg, kind){
  const el = document.getElementById('fixedDefaultsStatus');
  if(!el) return;
  el.innerHTML = `<div class="status-msg ${kind}">${escHtml(msg)}</div>`;
}

function onSettingChange(key, value){
  DATA.settings[key] = value;
  saveLocal();
  if(key==='personA' || key==='personB'){ /* labels only affect month view, no immediate refresh needed here */ }
}
function addMethod(){
  const input = document.getElementById('newMethodInput');
  const v = (input.value||'').trim();
  if(!v) return;
  if(DATA.settings.paymentMethods.includes(v)){ input.value=''; return; }
  DATA.settings.paymentMethods.push(v);
  saveLocal();
  render();
}
function removeMethod(i){
  if(!confirm('この支払方法を削除しますか？（すでに使われている項目のプルダウンは空欄になります）')) return;
  DATA.settings.paymentMethods.splice(i,1);
  saveLocal();
  render();
}

function exportJson(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `kakeibo_backup_${Date.now()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importJson(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = migrateData(JSON.parse(reader.result));
      if(!d || !d.years) throw new Error('形式が正しくありません');
      DATA = d; saveLocal(); render();
      showGithubStatus('読み込みました', 'ok');
    }catch(e){
      alert('読み込みに失敗しました: ' + e.message);
    }
  };
  reader.readAsText(file);
}
function resetAll(){
  if(!confirm('本当に初期状態（サンプルデータ）に戻しますか？現在の入力内容は失われます。')) return;
  DATA = defaultData();
  saveLocal();
  render();
}

/* ====================== GitHub 同期 ====================== */
function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_,p1)=>String.fromCharCode('0x'+p1)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}
function readCfgForm(){
  return {
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    branch: document.getElementById('cfgBranch').value.trim() || 'main',
    path: document.getElementById('cfgPath').value.trim() || 'data.json',
    token: document.getElementById('cfgToken').value.trim(),
  };
}
function saveGithubCfg(){
  const form = readCfgForm();
  const prev = loadCfg();
  const cfg = Object.assign({}, prev, form);
  saveCfg(cfg);
  showGithubStatus('設定を保存しました（この端末のブラウザ内）', 'ok');
}
function showGithubStatus(msg, kind){
  const el = document.getElementById('githubStatus');
  if(!el) return;
  el.innerHTML = `<div class="status-msg ${kind}">${escHtml(msg)}</div>`;
}
function apiUrl(cfg){
  return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
}
async function githubSave(){
  const form = readCfgForm();
  if(!form.owner || !form.repo || !form.token){ showGithubStatus('ユーザー名・リポジトリ名・トークンを入力してください', 'err'); return; }
  saveCfg(Object.assign({}, loadCfg(), form));
  showGithubStatus('GitHubに保存中…', 'info');
  try{
    let sha = undefined;
    // 既存ファイルのshaを取得（あれば）
    const getRes = await fetch(apiUrl(form)+`?ref=${encodeURIComponent(form.branch)}`, {
      headers:{ 'Authorization':`Bearer ${form.token}`, 'Accept':'application/vnd.github+json' }
    });
    if(getRes.status === 200){
      const j = await getRes.json();
      sha = j.sha;
    } else if(getRes.status !== 404){
      const t = await getRes.text();
      throw new Error(`確認に失敗 (${getRes.status}): ${t.slice(0,200)}`);
    }
    const content = b64EncodeUnicode(JSON.stringify(DATA, null, 2));
    const body = { message:`家計簿データ更新 ${new Date().toISOString()}`, content, branch: form.branch };
    if(sha) body.sha = sha;
    const putRes = await fetch(apiUrl(form), {
      method:'PUT',
      headers:{ 'Authorization':`Bearer ${form.token}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    if(!putRes.ok){
      const t = await putRes.text();
      throw new Error(`保存に失敗 (${putRes.status}): ${t.slice(0,300)}`);
    }
    const putJson = await putRes.json();
    const cfg = Object.assign({}, loadCfg(), form, { lastSync:new Date().toISOString(), lastSha: putJson.content && putJson.content.sha });
    saveCfg(cfg);
    DIRTY = false;
    updateSyncBadge();
    document.getElementById('lastSyncText').textContent = fmtDateTime(cfg.lastSync);
    showGithubStatus('GitHubへの保存が完了しました', 'ok');
  }catch(e){
    showGithubStatus(e.message, 'err');
  }
}
async function githubLoad(){
  const form = readCfgForm();
  if(!form.owner || !form.repo || !form.token){ showGithubStatus('ユーザー名・リポジトリ名・トークンを入力してください', 'err'); return; }
  saveCfg(Object.assign({}, loadCfg(), form));
  if(DIRTY && !confirm('この端末にまだGitHubへ保存していない変更があります。読み込むと上書きされますが続けますか？')) return;
  showGithubStatus('GitHubから読み込み中…', 'info');
  try{
    const getRes = await fetch(apiUrl(form)+`?ref=${encodeURIComponent(form.branch)}`, {
      headers:{ 'Authorization':`Bearer ${form.token}`, 'Accept':'application/vnd.github+json' }
    });
    if(getRes.status === 404){ throw new Error('ファイルが見つかりません。先に「GitHubへ保存」を1度実行してください'); }
    if(!getRes.ok){
      const t = await getRes.text();
      throw new Error(`読み込みに失敗 (${getRes.status}): ${t.slice(0,300)}`);
    }
    const j = await getRes.json();
    const text = b64DecodeUnicode(j.content.replace(/\n/g,''));
    const d = migrateData(JSON.parse(text));
    if(!d || !d.years) throw new Error('データの形式が正しくありません');
    DATA = d;
    saveLocal();
    DIRTY = false;
    const cfg = Object.assign({}, loadCfg(), form, { lastSync:new Date().toISOString(), lastSha:j.sha });
    saveCfg(cfg);
    updateSyncBadge();
    render();
    showGithubStatus('GitHubから読み込みました', 'ok');
    const t = document.getElementById('lastSyncText'); if(t) t.textContent = fmtDateTime(cfg.lastSync);
  }catch(e){
    showGithubStatus(e.message, 'err');
  }
}
function updateSyncBadge(){
  const badge = document.getElementById('headerSync');
  if(!badge) return;
  const cfg = loadCfg();
  if(!cfg.owner || !cfg.token){ badge.textContent = 'GitHub未設定'; return; }
  badge.textContent = DIRTY ? '● 未保存の変更あり' : ('✓ 同期済 ' + fmtDateTime(cfg.lastSync));
}

    </div>

        <li>入力する日を決める（例：給与日、月末の日曜日）。</li>
      </ul>
    </div>
  </div>
  `;

  updateSyncBadge();
